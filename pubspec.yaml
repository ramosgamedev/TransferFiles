name: transfer_files
description: "Transferencia de archivos entre PC y Meta Quest por WiFi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^9.2.0
  path_provider: ^2.1.5
  mime: ^2.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  device_info_plus: ^11.3.3
  share_plus: ^10.1.4
  open_file: ^3.5.11
  tray_manager: ^0.2.4
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
